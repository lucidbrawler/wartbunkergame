<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Warhog neon DEX exchange">
  <defs>
    <radialGradient id="dxAmbient" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dxPool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="dxPoolSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="dxCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="dxGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="dxLabel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ccfbf1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="dxNeon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="dxSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="dxBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="160" cy="112" rx="116" ry="84" fill="url(#dxAmbient)"/>

  <!-- liquidity pools -->
  <g filter="url(#dxNeon)" opacity="0.9">
    <ellipse cx="96" cy="148" rx="46" ry="24" fill="url(#dxPool)" stroke="#2dd4bf" stroke-opacity="0.65" stroke-width="2"/>
    <ellipse cx="96" cy="142" rx="38" ry="14" fill="none" stroke="url(#dxPoolSurface)" stroke-width="2"/>
    <ellipse cx="224" cy="148" rx="46" ry="24" fill="url(#dxPool)" stroke="#2dd4bf" stroke-opacity="0.65" stroke-width="2"/>
    <ellipse cx="224" cy="142" rx="38" ry="14" fill="none" stroke="url(#dxPoolSurface)" stroke-width="2"/>
  </g>

  <!-- swap arrows -->
  <g filter="url(#dxBloom)">
    <path d="M128 132 L160 104 L192 132" fill="none" stroke="url(#dxGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 104 L160 90 L172 104" fill="#fbbf24" fill-opacity="0.35" stroke="url(#dxGold)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M192 164 L160 192 L128 164" fill="none" stroke="url(#dxCyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 192 L160 206 L148 192" fill="#22d3ee" fill-opacity="0.3" stroke="url(#dxCyan)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- center kiosk hologram -->
  <g filter="url(#dxSoft)">
    <rect x="132" y="86" width="56" height="54" rx="6" fill="url(#dxGlass)" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.8"/>
    <rect x="140" y="94" width="40" height="34" rx="3" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M148 104 H172 M148 114 H168 M148 124 H172" stroke="#86efac" stroke-opacity="0.75" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="160" cy="111" r="22" fill="#2dd4bf" fill-opacity="0.04"/>
  </g>

  <!-- swap pulse rings -->
  <g filter="url(#dxSoft)" opacity="0.65">
    <ellipse cx="160" cy="148" rx="28" ry="10" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 5"/>
    <ellipse cx="160" cy="204" rx="108" ry="12" fill="#2dd4bf" fill-opacity="0.05" stroke="url(#dxCyan)" stroke-width="1.2" stroke-opacity="0.5"/>
  </g>

  <text x="160" y="78" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="15" fill="url(#dxGold)" filter="url(#dxSoft)">SWAP</text>
  <text x="160" y="226" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="13" fill="url(#dxLabel)" letter-spacing="3" filter="url(#dxSoft)">DEX</text>
</svg>