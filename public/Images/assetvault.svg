<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Warhog neon asset vault">
  <defs>
    <radialGradient id="avAmbient" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="avVault" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="avGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff8c00" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avToken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="avGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="avLabel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="avCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ff8c00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="avNeon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="avSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="avBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="160" cy="118" rx="112" ry="82" fill="url(#avAmbient)"/>

  <!-- holographic vault frame -->
  <g filter="url(#avNeon)" opacity="0.9">
    <path d="M80 188 L100 68 L220 68 L240 188 Z" fill="url(#avVault)" stroke="url(#avCyan)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M96 188 L112 84 L208 84 L224 188 Z" fill="url(#avGlass)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="30" y1="60" x2="50" y2="180" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="290" y1="60" x2="270" y2="180" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="160" y1="40" x2="160" y2="200" stroke="#6366f1" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- vault seal ring -->
  <g filter="url(#avBloom)">
    <circle cx="160" cy="132" r="40" fill="url(#avGlass)" stroke="url(#avGold)" stroke-width="2.5"/>
    <circle cx="160" cy="132" r="30" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="5 4"/>
    <circle cx="160" cy="132" r="20" fill="url(#avCore)"/>
    <ellipse cx="154" cy="128" rx="9" ry="6" fill="#fde68a" fill-opacity="0.55"/>
    <path d="M144 132 C148 140 156 142 166 134 L170 126 C162 120 150 118 144 122 Z" fill="#ff8c00" fill-opacity="0.42" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1"/>
  </g>

  <!-- floating tokens -->
  <g filter="url(#avSoft)">
    <circle cx="108" cy="96" r="14" fill="url(#avToken)" stroke="url(#avCyan)" stroke-width="1.5"/>
    <circle cx="108" cy="96" r="20" fill="#38bdf8" fill-opacity="0.06"/>
    <text x="108" y="100" text-anchor="middle" font-family="Impact,sans-serif" font-size="10" fill="#e0f2fe" fill-opacity="0.9">W</text>

    <circle cx="212" cy="92" r="12" fill="url(#avToken)" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="212" cy="92" r="18" fill="#38bdf8" fill-opacity="0.05"/>

    <circle cx="224" cy="148" r="11" fill="#fbbf24" fill-opacity="0.22" stroke="url(#avGold)" stroke-width="1.5"/>
    <circle cx="224" cy="148" r="17" fill="#fbbf24" fill-opacity="0.06"/>
  </g>

  <!-- lock beam -->
  <g filter="url(#avSoft)" opacity="0.8">
    <rect x="148" y="166" width="24" height="16" rx="3" fill="url(#avGlass)" stroke="url(#avGold)" stroke-width="1.5"/>
    <circle cx="160" cy="174" r="4" fill="#fde68a" fill-opacity="0.55"/>
    <ellipse cx="160" cy="196" rx="72" ry="10" fill="#38bdf8" fill-opacity="0.05" stroke="url(#avCyan)" stroke-width="1"/>
  </g>

  <text x="160" y="226" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="13" fill="url(#avLabel)" letter-spacing="3" filter="url(#avSoft)">ASSETS</text>
</svg>