<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Warhog defense radar comic">
  <defs>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0c4a6e" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="320" height="240" fill="#060d14"/>
  <path d="M160 24 L160 56 M140 40 L180 40" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- radar screen -->
  <rect x="64" y="48" width="192" height="112" rx="8" fill="#1e293b" stroke="#020617" stroke-width="3"/>
  <rect x="76" y="60" width="168" height="88" rx="4" fill="#020617" stroke="#00e5ff" stroke-width="2.5"/>
  <rect x="76" y="60" width="168" height="88" rx="4" fill="url(#dots)"/>

  <circle cx="160" cy="104" r="32" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="160" cy="104" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160" cy="104" r="8" fill="none" stroke="#5eead4" stroke-width="1.5"/>
  <line x1="160" y1="72" x2="160" y2="136" stroke="#334155" stroke-width="1.5"/>
  <line x1="128" y1="104" x2="192" y2="104" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="104" x2="188" y2="80" stroke="#00e5ff" stroke-width="3"/>

  <!-- threat blips -->
  <path d="M140 84 L144 92 L136 92 Z" fill="#ff3366" stroke="#020617" stroke-width="1"/>
  <path d="M180 112 L184 120 L176 120 Z" fill="#ff3366" stroke="#020617" stroke-width="1"/>
  <circle cx="172" cy="88" r="4" fill="#FDB913" stroke="#020617" stroke-width="1"/>

  <!-- console desk -->
  <rect x="48" y="164" width="224" height="40" rx="6" fill="#334155" stroke="#020617" stroke-width="3"/>
  <circle cx="88" cy="184" r="10" fill="#0f172a" stroke="#FDB913" stroke-width="2"/>
  <circle cx="232" cy="184" r="10" fill="#0f172a" stroke="#FDB913" stroke-width="2"/>
  <rect x="120" y="176" width="80" height="8" rx="2" fill="#22c55e" stroke="#020617" stroke-width="1"/>
  <rect x="128" y="176" width="48" height="8" rx="2" fill="#4ade80"/>

  <path d="M108 44 Q160 20 212 44" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.55"/>
  <text x="160" y="228" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="12" fill="#38bdf8" letter-spacing="2">DEFENSE</text>
</svg>