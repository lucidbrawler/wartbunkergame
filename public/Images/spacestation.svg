<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Warhog neon orbital space station">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hubGlass" cx="40%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.04"/>
    </radialGradient>

    <radialGradient id="hubCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ff6b2c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#ff8c00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="armGreen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="armRed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff3366" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="armTeal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="solarNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="dockGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="labelNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="neonCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neonSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neonBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent canvas — ambient halo only -->
  <ellipse cx="160" cy="108" rx="118" ry="88" fill="url(#ambient)"/>

  <!-- distant stars — soft neon pinpoints -->
  <g filter="url(#starGlow)" opacity="0.7">
    <circle cx="28" cy="32" r="1.4" fill="#e0f2fe" fill-opacity="0.9"/>
    <circle cx="72" cy="18" r="1" fill="#7dd3fc" fill-opacity="0.75"/>
    <circle cx="118" cy="44" r="1.2" fill="#f0f9ff" fill-opacity="0.85"/>
    <circle cx="196" cy="24" r="1.3" fill="#bae6fd" fill-opacity="0.8"/>
    <circle cx="252" cy="38" r="1" fill="#e0f2fe" fill-opacity="0.7"/>
    <circle cx="288" cy="64" r="1.1" fill="#7dd3fc" fill-opacity="0.75"/>
    <circle cx="44" cy="88" r="0.8" fill="#a5f3fc" fill-opacity="0.55"/>
    <circle cx="276" cy="96" r="0.9" fill="#bae6fd" fill-opacity="0.6"/>
  </g>

  <!-- outer orbital ring — neon wire -->
  <g filter="url(#neonCyan)" opacity="0.9">
    <ellipse cx="160" cy="112" rx="108" ry="28" fill="none" stroke="url(#ringCyan)" stroke-width="2.5"/>
    <ellipse cx="160" cy="112" rx="92" ry="22" fill="none" stroke="url(#ringGold)" stroke-width="1.2" opacity="0.75"/>
  </g>

  <!-- ring node halos -->
  <g filter="url(#neonSoft)">
    <circle cx="52" cy="112" r="9" fill="#00e5ff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="268" cy="112" r="9" fill="#00e5ff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle cx="160" cy="84" r="8" fill="#fbbf24" fill-opacity="0.1" stroke="#fde68a" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="160" cy="140" r="8" fill="#fbbf24" fill-opacity="0.1" stroke="#fde68a" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>

  <!-- exploration arm — holographic scan dish -->
  <g filter="url(#neonSoft)">
    <rect x="38" y="100" width="52" height="16" rx="4" fill="url(#panelGlass)" stroke="url(#armGreen)" stroke-width="1.5"/>
    <line x1="24" y1="108" x2="38" y2="108" stroke="url(#armGreen)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M18 92 Q8 108 18 124 Q28 108 18 92 Z" fill="#4ade80" fill-opacity="0.12" stroke="url(#armGreen)" stroke-width="2"/>
    <circle cx="18" cy="108" r="5" fill="#4ade80" fill-opacity="0.35"/>
    <line x1="18" y1="108" x2="34" y2="98" stroke="#86efac" stroke-opacity="0.65" stroke-width="1.2"/>
    <line x1="18" y1="108" x2="34" y2="118" stroke="#86efac" stroke-opacity="0.65" stroke-width="1.2"/>
    <path d="M10 108 Q18 88 26 108" fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <!-- combat arm — neon turret beam -->
  <g filter="url(#neonSoft)">
    <rect x="218" y="72" width="48" height="14" rx="4" fill="url(#panelGlass)" stroke="url(#armRed)" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="266" y1="79" x2="278" y2="79" stroke="url(#armRed)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="276" y="70" width="22" height="18" rx="4" fill="#ff3366" fill-opacity="0.1" stroke="url(#armRed)" stroke-width="2"/>
    <rect x="282" y="74" width="14" height="10" rx="2" fill="#ff3366" fill-opacity="0.18" stroke="#fb7185" stroke-opacity="0.7" stroke-width="1"/>
    <line x1="296" y1="79" x2="318" y2="68" stroke="url(#armRed)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="318" cy="68" r="6" fill="#ff3366" fill-opacity="0.45"/>
    <circle cx="318" cy="68" r="12" fill="#ff3366" fill-opacity="0.08"/>
  </g>

  <!-- trade arm — translucent cargo glow -->
  <g filter="url(#neonSoft)">
    <rect x="210" y="128" width="56" height="18" rx="4" fill="url(#panelGlass)" stroke="url(#armTeal)" stroke-width="1.5"/>
    <line x1="266" y1="137" x2="280" y2="137" stroke="url(#armTeal)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="278" y="124" width="28" height="26" rx="5" fill="#2dd4bf" fill-opacity="0.1" stroke="url(#armTeal)" stroke-width="2"/>
    <rect x="284" y="130" width="16" height="14" rx="2" fill="#5eead4" fill-opacity="0.2" stroke="#99f6e4" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="302" cy="118" r="10" fill="#fbbf24" fill-opacity="0.22" stroke="#fde68a" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="302" y="121" text-anchor="middle" font-family="Impact,sans-serif" font-size="8" fill="#fde68a" fill-opacity="0.9">W</text>
  </g>

  <!-- solar wings — glass neon panels -->
  <g filter="url(#neonSoft)" opacity="0.85">
    <rect x="118" y="50" width="38" height="11" rx="2" fill="url(#solarNeon)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="128" y1="50" x2="128" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="140" y1="50" x2="140" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="152" y1="50" x2="152" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <rect x="164" y="50" width="38" height="11" rx="2" fill="url(#solarNeon)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="174" y1="50" x2="174" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="186" y1="50" x2="186" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="198" y1="50" x2="198" y2="61" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="160" y1="61" x2="160" y2="72" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- central hub — glass sphere + sigil bloom -->
  <g filter="url(#neonBloom)">
    <circle cx="160" cy="108" r="36" fill="url(#hubGlass)" stroke="url(#ringCyan)" stroke-width="2"/>
    <circle cx="160" cy="108" r="28" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 5"/>
    <circle cx="160" cy="108" r="18" fill="url(#hubCore)"/>
    <ellipse cx="154" cy="104" rx="9" ry="6" fill="#fde68a" fill-opacity="0.55"/>
    <path d="M146 108 C150 116 158 118 168 110 L172 102 C164 96 152 94 146 98 Z" fill="#ff8c00" fill-opacity="0.45" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- zone beacons -->
  <g filter="url(#neonSoft)">
    <circle cx="108" cy="108" r="5" fill="#4ade80" fill-opacity="0.4"/>
    <circle cx="108" cy="108" r="9" fill="#4ade80" fill-opacity="0.08"/>
    <circle cx="196" cy="88" r="5" fill="#ff3366" fill-opacity="0.4"/>
    <circle cx="196" cy="88" r="9" fill="#ff3366" fill-opacity="0.08"/>
    <circle cx="196" cy="132" r="5" fill="#fbbf24" fill-opacity="0.4"/>
    <circle cx="196" cy="132" r="9" fill="#fbbf24" fill-opacity="0.08"/>
  </g>

  <!-- holographic dock — no solid shadow -->
  <g filter="url(#neonCyan)" opacity="0.85">
    <ellipse cx="160" cy="188" rx="88" ry="12" fill="#00e5ff" fill-opacity="0.06" stroke="url(#dockGlow)" stroke-width="1.5"/>
    <rect x="108" y="172" width="104" height="18" rx="5" fill="url(#panelGlass)" stroke="url(#dockGlow)" stroke-width="1.8"/>
    <rect x="120" y="176" width="80" height="10" rx="3" fill="#38bdf8" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1"/>
  </g>

  <!-- label — neon type, no fill box -->
  <text x="160" y="226" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="13" fill="url(#labelNeon)" letter-spacing="3" filter="url(#neonSoft)">STATION</text>
</svg>