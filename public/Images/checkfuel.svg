<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Check fuel">
  <defs>
    <radialGradient id="fuelGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#FDB913" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FDB913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuelTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fuelLiquid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#FDB913"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="160" cy="118" r="74" fill="url(#fuelGlow)"/>
  <rect x="118" y="68" width="84" height="108" rx="10" fill="url(#fuelTank)" stroke="#94a3b8" stroke-width="2" filter="url(#softGlow)"/>
  <rect x="128" y="108" width="64" height="58" rx="6" fill="url(#fuelLiquid)" opacity="0.85"/>
  <rect x="148" y="58" width="24" height="18" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <rect x="138" y="88" width="44" height="6" rx="2" fill="#22d3ee" opacity="0.7"/>
  <text x="160" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1004" font-weight="700">78%</text>
  <ellipse cx="160" cy="188" rx="68" ry="11" fill="#0a0804" opacity="0.9"/>
</svg>