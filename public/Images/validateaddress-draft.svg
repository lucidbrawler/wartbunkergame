<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Warhog address validation outpost">
  <defs>
    <radialGradient id="vaGlow" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#14532d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vaScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="vaGlowFx" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vaFeather" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.22" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feGaussianBlur in="warp" stdDeviation="0.35" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="warp"/></feMerge>
    </filter>
    <filter id="vaSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.45" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="160" cy="120" r="108" ry="72" fill="url(#vaGlow)"/>

  <!-- background trees -->
  <g opacity="0.8">
    <g>
      <rect x="18" y="110" width="5" height="58" rx="1" fill="#1a1208"/>
      <g filter="url(#vaFeather)">
        <path d="M20 110 Q14 118 10 126 Q8 130 11 132 Q16 133 20 130 Q26 132 30 129 Q28 124 24 116 Q22 112 20 110Z" fill="#14352a"/>
        <path d="M20 100 Q12 110 6 120 Q4 125 8 128 Q14 129 20 126 Q28 128 36 125 Q34 116 28 106 Q24 102 20 100Z" fill="#1a4d35"/>
        <path d="M20 88 Q10 100 4 112 Q2 118 6 122 Q12 123 20 119 Q30 122 40 118 Q38 106 30 92 Q25 88 20 88Z" fill="#1e5c3e" opacity="0.9"/>
      </g>
      <g stroke-linecap="round" opacity="0.48" filter="url(#vaSoft)">
        <path d="M9 129 Q7 126 9 123 M15 130 Q13 127 15 124 M25 128 Q23 125 25 122" fill="none" stroke="#3d9a62" stroke-width="0.36"/>
      </g>
    </g>
    <g>
      <rect x="42" y="120" width="4" height="48" rx="1" fill="#1a1208"/>
      <g filter="url(#vaFeather)">
        <path d="M44 120 Q38 126 34 132 Q32 135 36 136 Q40 137 44 134 Q50 136 56 134 Q55 129 50 122 Q47 120 44 120Z" fill="#14352a"/>
        <path d="M44 108 Q36 118 30 126 Q28 130 32 132 Q38 133 44 130 Q52 132 60 129 Q58 120 52 110 Q48 108 44 108Z" fill="#1a4d35"/>
