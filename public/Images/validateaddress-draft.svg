  <path d="M124 124 L127 127 L133 121" fill="none" stroke="#86efac" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- magnifier -->
  <circle cx="196" cy="108" r="14" fill="none" stroke="#d97706" stroke-width="1.4" opacity="0.85"/>
  <circle cx="196" cy="108" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="0.65" opacity="0.9"/>
  <line x1="206" y1="118" x2="218" y2="130" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="206" y1="118" x2="218" y2="130" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

  <!-- status lamp -->
  <circle cx="112" cy="80" r="2" fill="#4ade80" filter="url(#vaGlowFx)" opacity="0.8"/>

  <!-- foreground trees -->
  <g>
    <rect x="64" y="150" width="6" height="36" rx="1.5" fill="#1a1208"/>
    <g filter="url(#vaFeather)">
