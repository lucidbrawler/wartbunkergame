      <g filter="url(#vaFeather)">
        <path d="M301 128 Q297 134 294 139 Q293 141 296 142 Q299 143 303 141 Q306 142 308 140 Q307 136 304 131 Q302 129 301 128Z" fill="#14352a"/>
        <path d="M301 118 Q296 126 293 132 Q292 135 295 136 Q299 137 303 134 Q307 136 310 133 Q308 127 304 121 Q302 119 301 118Z" fill="#1a4d35"/>
      </g>
    </g>
  </g>

