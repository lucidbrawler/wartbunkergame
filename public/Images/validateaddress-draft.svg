    <path d="M256 170 Q254 166 258 168 Q260 172 256 170Z" fill="#3d9a62" opacity="0.5"/>
    <line x1="246" y1="178" x2="245" y2="172" stroke="#2a1a0a" stroke-width="0.45"/>
  </g>
  <!-- low bushes near console -->
  <g opacity="0.55">
    <path d="M108 178 Q104 172 110 168 Q114 170 112 176 Q110 180 108 178Z" fill="#14352a" filter="url(#vaFeather)"/>
    <path d="M200 178 Q196 172 202 168 Q206 170 204 176 Q202 180 200 178Z" fill="#14352a" filter="url(#vaFeather)"/>
    <path d="M124 182 Q120 176 126 174 Q130 176 128 180 Q126 183 124 182Z" fill="#1e5c3e" filter="url(#vaFeather)" opacity="0.7"/>
    <path d="M188 182 Q184 176 190 174 Q194 176 192 180 Q190 183 188 182Z" fill="#1e5c3e" filter="url(#vaFeather)" opacity="0.7"/>
