  <rect x="148" y="88" width="22" height="10" rx="1" fill="#334155" stroke="#64748b" stroke-width="0.4"/>
  <rect x="174" y="88" width="22" height="10" rx="1" fill="#d97706" stroke="#64748b" stroke-width="0.4" opacity="0.85"/>
  <rect x="122" y="102" width="44" height="10" rx="1" fill="#334155" stroke="#64748b" stroke-width="0.4"/>
