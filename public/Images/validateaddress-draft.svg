      <path d="M276 128 Q260 146 254 156 Q264 160 276 156 Q290 160 300 156 Q292 138 284 130 Q280 128 276 128Z" fill="#1e5c3e"/>
    </g>
    <g stroke-linecap="round" opacity="0.48" filter="url(#vaSoft)">
