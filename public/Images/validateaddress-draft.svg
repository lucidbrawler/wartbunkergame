  <!-- front bush pair -->
  <g opacity="0.7" filter="url(#vaSoft)">
    <path d="M88 184 Q82 176 90 172 Q96 174 94 180 Q90 186 88 184Z" fill="#1a4d35" filter="url(#vaFeather)"/>
    <path d="M224 184 Q218 176 226 172 Q232 174 230 180 Q226 186 224 184Z" fill="#1a4d35" filter="url(#vaFeather)"/>
    <path d="M96 186 Q92 180 100 178 Q104 182 100 186 Q98 188 96 186Z" fill="#2d7a52" opacity="0.55" filter="url(#vaFeather)"/>
    <path d="M216 186 Q212 180 220 178 Q224 182 220 186 Q218 188 216 186Z" fill="#2d7a52" opacity="0.55" filter="url(#vaFeather)"/>
