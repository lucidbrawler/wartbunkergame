# Wart Bunker co-op relay — add to warthog-defitestnet.duckdns.org server { } block.
# Go service listens on 127.0.0.1:8765; nginx terminates TLS and proxies wss.
location /coop/ws {
    proxy_pass http://127.0.0.1:8765/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

# Optional health check (not required for gameplay)
location /coop/health {
    proxy_pass http://127.0.0.1:8765/health;
    proxy_set_header Host $host;
}